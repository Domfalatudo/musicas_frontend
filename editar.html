<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar música</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="editar.css">
</head>
<body>
    <a class="voltar" href="index.html">
        <span class="material-symbols-outlined">arrow_back</span>
    </a>
    
    <main>
        <h1>Editar música</h1>

        <label for="titulo">Título</label>
        <input type="text" id="titulo">

        <label for="artista">Artista</label>
        <input type="text" id="artista">

        <label for="genero">Gênero</label>
        <input type="text" id="genero">

        <label for="ano">Ano</label>
        <input type="number" id="ano">

        <label for="duracao">Duração em minutos</label>
        <input type="number" id="duracao">

        <button id="botaoSalvar">Salvar alterações</button>
    </main>
    <script src="editar.js"></script>
</body>
</html>
